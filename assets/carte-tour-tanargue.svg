<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Carte schematique du Tour du Tanargue</title>
  <desc id="desc">Boucle indicative en trois etapes entre Largentiere, Loubaresse, Rocles, Chassiers et les cretes du Tanargue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2efd9"/>
      <stop offset="0.52" stop-color="#e8ead2"/>
      <stop offset="1" stop-color="#dbe4d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#243b2f" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <g opacity=".56">
    <path d="M-40 640 C160 565 275 598 438 515 C621 421 735 468 900 368 C1096 249 1210 284 1450 188" fill="none" stroke="#8f6b48" stroke-width="82" stroke-linecap="round" opacity=".18"/>
    <path d="M-60 732 C166 665 335 690 520 600 C711 508 816 546 1015 438 C1169 354 1279 360 1456 292" fill="none" stroke="#55714f" stroke-width="70" stroke-linecap="round" opacity=".17"/>
    <path d="M25 198 C205 152 356 185 522 132 C733 65 853 126 1038 82 C1196 44 1270 61 1392 20" fill="none" stroke="#9b7b58" stroke-width="42" stroke-linecap="round" opacity=".13"/>
    <path d="M144 790 C305 732 449 748 601 682 C783 603 922 650 1118 568 C1244 515 1340 518 1460 466" fill="none" stroke="#3d5f47" stroke-width="28" stroke-linecap="round" opacity=".15"/>
  </g>

  <g fill="none" stroke="#a98761" stroke-linecap="round" opacity=".38">
    <path d="M122 708 C288 626 379 651 531 560 C681 471 815 510 965 410 C1110 313 1224 336 1328 278" stroke-width="3"/>
    <path d="M82 604 C248 538 399 557 560 469 C729 376 844 420 1022 310 C1168 220 1261 241 1378 176" stroke-width="3"/>
    <path d="M196 502 C344 438 467 452 602 380 C756 299 899 326 1048 242" stroke-width="2"/>
    <path d="M278 810 C448 730 565 762 742 675 C898 598 1049 622 1244 535" stroke-width="2"/>
  </g>

  <g opacity=".8">
    <path d="M1014 236 l35 -72 l37 72 z" fill="#6f8c54" filter="url(#shadow)"/>
    <text x="1084" y="204" fill="#2f4437" font-size="22" font-weight="800">Massif du Tanargue</text>
    <path d="M952 268 C1006 246 1046 248 1102 270" fill="none" stroke="#3f5f45" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M260 690 C360 620 406 540 472 474 C545 401 628 346 724 295 C812 249 908 230 1042 238" stroke="#3c78a8" stroke-width="15"/>
    <path d="M1042 238 C1118 290 1160 366 1126 452 C1094 532 990 564 880 592 C803 612 746 642 684 692" stroke="#d9872d" stroke-width="15"/>
    <path d="M684 692 C586 721 486 755 382 748 C322 744 276 726 260 690" stroke="#4f8b55" stroke-width="15"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M260 690 C360 620 406 540 472 474 C545 401 628 346 724 295 C812 249 908 230 1042 238" stroke-width="4"/>
    <path d="M1042 238 C1118 290 1160 366 1126 452 C1094 532 990 564 880 592 C803 612 746 642 684 692" stroke-width="4"/>
    <path d="M684 692 C586 721 486 755 382 748 C322 744 276 726 260 690" stroke-width="4"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g class="point" transform="translate(260 690)">
      <circle r="16" fill="#ffffff" stroke="#31513f" stroke-width="6"/>
      <text x="-112" y="8" fill="#17211c" font-size="25" font-weight="800">Largentiere</text>
    </g>

    <g class="point" transform="translate(740 292)">
      <circle r="13" fill="#ffffff" stroke="#3c78a8" stroke-width="5"/>
      <text x="-112" y="-24" fill="#17211c" font-size="22" font-weight="800">Col de Meyrand</text>
    </g>

    <g class="point" transform="translate(1042 238)">
      <circle r="16" fill="#ffffff" stroke="#d9872d" stroke-width="6"/>
      <text x="26" y="8" fill="#17211c" font-size="25" font-weight="800">Loubaresse</text>
    </g>

    <g class="point" transform="translate(684 692)">
      <circle r="16" fill="#ffffff" stroke="#4f8b55" stroke-width="6"/>
      <text x="25" y="7" fill="#17211c" font-size="25" font-weight="800">Rocles / Le Jal</text>
    </g>

    <g class="point village" transform="translate(444 744)">
      <circle r="10" fill="#ffffff" stroke="#6e7867" stroke-width="4"/>
      <text x="-44" y="42" fill="#17211c" font-size="20" font-weight="800">Joannas</text>
    </g>

    <g class="point village" transform="translate(346 730)">
      <circle r="10" fill="#ffffff" stroke="#6e7867" stroke-width="4"/>
      <text x="-54" y="-25" fill="#17211c" font-size="20" font-weight="800">Chassiers</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <rect x="72" y="58" width="390" height="142" rx="8" fill="#ffffff" opacity=".86"/>
    <text x="98" y="103" fill="#17211c" font-size="29">GRP Tour du Tanargue</text>
    <text x="98" y="140" fill="#5f6b62" font-size="19">Schema indicatif en 3 jours</text>
    <text x="98" y="170" fill="#5f6b62" font-size="19">Depart et retour : Largentiere</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">
    <rect x="1016" y="716" width="300" height="124" rx="8" fill="#ffffff" opacity=".88"/>
    <line x1="1042" y1="750" x2="1115" y2="750" stroke="#3c78a8" stroke-width="10" stroke-linecap="round"/>
    <text x="1130" y="756" fill="#17211c">Etape 1</text>
    <line x1="1042" y1="786" x2="1115" y2="786" stroke="#d9872d" stroke-width="10" stroke-linecap="round"/>
    <text x="1130" y="792" fill="#17211c">Etape 2</text>
    <line x1="1042" y1="822" x2="1115" y2="822" stroke="#4f8b55" stroke-width="10" stroke-linecap="round"/>
    <text x="1130" y="828" fill="#17211c">Etape 3</text>
  </g>
</svg>
